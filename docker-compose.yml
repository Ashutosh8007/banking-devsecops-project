services:
  mongo:
    image: mongo:7
    container_name: banking-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - banking-net


  backend:
    build: 
      context: .
      dockerfile: Backend/Dockerfile
    container_name: banking-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/banking
      - JWT_SECRET=${JWT_SECRET}
      - CORS_DOMAIN=http://localhost:5173,http://localhost:8081
      - ALLOW_OWNER_BOOTSTRAP=true
    depends_on:
      - mongo
    networks:
      - banking-net


  frontend:
    build: 
      context: .
      dockerfile: Frontend/Dockerfile
    container_name: banking-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - banking-net

networks:
  banking-net:
    driver: bridge

volumes:
  mongo-data: