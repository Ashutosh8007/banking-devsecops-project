apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: banking-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Ashutosh8007/banking-devsecops-project.git
    targetRevision: main
    path: k8s
  destination:
    server: https://172.31.90.207:6443
    namespace: banking
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
