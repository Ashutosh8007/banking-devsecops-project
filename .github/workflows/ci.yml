name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-build:
    name: Backend Install & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install backend dependencies
        run: npm install

      - name: Run tests with coverage
        run: npm test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  frontend-build:
    name: Frontend Install & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./Frontend
        run: npm install

      - name: Build frontend
        working-directory: ./Frontend
        run: npm run build

  sonarcloud-scan:
    name: SonarCloud Code Analysis
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  security-scan-and-push:
    name: Build, Scan & Push Docker Images
    runs-on: ubuntu-latest
    needs: [sonarcloud-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Backend/Dockerfile
          load: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/banking-backend:${{ github.sha }}

      - name: Build Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Frontend/Dockerfile
          load: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/banking-frontend:${{ github.sha }}

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with :
          project: 'banking-devsecops-project'
          path : '.'
          format: 'HTML'
          args: >
            --exclude "**/node_modules/**"
            --exclude "**/Frontend/dist/**"

      - name: Upload OWASP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-dependency-check-report
          path: reports/

      - name: Trivy scan - backend image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/banking-backend:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Trivy scan - frontend image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/banking-frontend:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Backend Image
        run: |
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/banking-backend:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/banking-backend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/banking-backend:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/banking-backend:latest

      - name: Push Frontend Image
        run: |
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/banking-frontend:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/banking-frontend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/banking-frontend:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/banking-frontend:latest
